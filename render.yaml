services:
  - type: web
    name: football-info-demo
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CREATE_DEFAULT_USERS
        value: "1"
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: PORT
        value: "5000"
      - key: GUNICORN_WORKERS
        value: "1"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
