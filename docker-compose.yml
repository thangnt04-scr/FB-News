services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: football-app:latest
    container_name: football-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-4298703a446bbf0d3c91a79c8ed938731557f31c201578a970cdf0367d1b27dc}
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY:-}
      - DATABASE_URL=sqlite:///footballinfor.db
    volumes:
      # Mount database for persistence
      - ./footballinfor.db:/app/footballinfor.db
      # Mount logs directory (create if not exists)
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - football-network

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  football-network:
    driver: bridge

volumes:
  db-data:
    driver: local

