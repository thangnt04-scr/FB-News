# ===========================================================================
#                      DOCKER COMPOSE - FOOTBALL APP
# ===========================================================================
# Production-ready Docker Compose configuration with security options
# ===========================================================================

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: football-app:latest
    container_name: football-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./footballinfor.db:/app/footballinfor.db
      - ./logs:/app/logs
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Read-only root filesystem (except for specific volumes)
    read_only: false

    # Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Network mode
    networks:
      - football-network

networks:
  football-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

