name: Deploy to Azure Web App

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Web App (container)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag }}

      - name: Configure app settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {"name": "WEBSITES_PORT", "value": "5000"},
              {"name": "FLASK_SECRET_KEY", "value": "${{ secrets.FLASK_SECRET_KEY }}"},
              {"name": "FOOTBALL_DATA_API_KEY", "value": "${{ secrets.FOOTBALL_DATA_API_KEY }}"},
              {"name": "CREATE_DEFAULT_USERS", "value": "1"}
            ]
